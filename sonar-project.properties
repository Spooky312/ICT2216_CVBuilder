sonar.organization=spooky312
sonar.projectKey=ict2216-cvbuilder
sonar.projectName=ICT2216 CVBuilder
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.test.inclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Operational CLI scripts and non-logic entrypoints are excluded from coverage
# (they are exercised manually / in ops, not by the unit test suite).
sonar.coverage.exclusions=backend/app/scripts/**,frontend/src/index.js,frontend/src/reportWebVitals.js,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx
sonar.exclusions=**/__pycache__/**,**/migrations/**,**/.pytest_cache/**,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
